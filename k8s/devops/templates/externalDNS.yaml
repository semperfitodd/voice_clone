apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-dns
  namespace: argocd
spec:
  destination:
    namespace: kube-system
    server: https://kubernetes.default.svc
  project: devops
  source:
    chart: external-dns
    helm:
      values: |-
        domainFilters:
          - {{ .Values.publicDomain }}
        provider:
          name: aws
        extraArgs:
          aws-zone-type: public
        registry: txt
        txtOwnerId: {{ .Values.publicDomainId }}
        policy: upsert-only
        rbac:
          create: true
        serviceAccount:
          create: true
          name: external-dns
          annotations:
            eks.amazonaws.com/role-arn: arn:aws:iam::{{ .Values.awsAccountNumber }}:role/{{ .Values.environment }}-AmazonEKSRoute53ExternalDNS
    repoURL: https://kubernetes-sigs.github.io/external-dns/
    targetRevision: 1.22.0
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 2
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m0s
